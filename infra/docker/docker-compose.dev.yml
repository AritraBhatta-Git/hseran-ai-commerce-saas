version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: hseran_postgres
    restart: always
    environment:
      POSTGRES_USER: hseran
      POSTGRES_PASSWORD: hseranpass
      POSTGRES_DB: hseran_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: hseran_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
